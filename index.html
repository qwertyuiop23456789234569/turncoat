// TURNCOAT web size budget: index.wasm / index.pck ship gzip-compressed as *.gz (any static host works,
// no server config needed). They are inflated in the browser with DecompressionStream (iOS 16.4+).
// If a host already sends them with Content-Encoding (bytes are no longer gzip), they pass through untouched.
(function () {
	const nativeFetch = window.fetch.bind(window);
	window.fetch = function (input, init) {
		const url = (typeof input === 'string') ? input : (input && input.url) || '';
		const m = url.match(/\.(wasm|pck)(\?.*)?$/);
		if (!m || typeof DecompressionStream === 'undefined') {
			return nativeFetch(input, init);
		}
		const gzUrl = url.replace(/\.(wasm|pck)(\?.*)?$/, '.$1.gz$2');
		return nativeFetch(gzUrl, init).then(async (res) => {
			if (!res.ok) { return nativeFetch(input, init); }
			const reader = res.body.getReader();
			const first = await reader.read();
			const head = first.value || new Uint8Array(0);
			const isGz = head.length > 1 && head[0] === 0x1f && head[1] === 0x8b;
			let stream = new ReadableStream({
				start(ctrl) { if (head.length) { ctrl.enqueue(head); } if (first.done) { ctrl.close(); } },
				async pull(ctrl) { const r = await reader.read(); if (r.done) { ctrl.close(); } else { ctrl.enqueue(r.value); } },
				cancel(e) { reader.cancel(e); },
			});
			if (isGz) { stream = stream.pipeThrough(new DecompressionStream('gzip')); }
			const type = m[1] === 'wasm' ? 'application/wasm' : 'application/octet-stream';
			return new Response(stream, { status: 200, headers: { 'Content-Type': type } });
		});
	};
}());
// TURNCOAT (Tinega Studios): iOS Safari only lets Web Audio start inside a user gesture.
// Track every AudioContext the engine creates and resume them on the first touch/click/key.
(function () {
	const Native = window.AudioContext || window.webkitAudioContext;
	if (!Native) { return; }
	const ctxs = [];
	function Tracked(...a) { const c = new Native(...a); ctxs.push(c); return c; }
	Tracked.prototype = Native.prototype;
	window.AudioContext = Tracked;
	if (window.webkitAudioContext) { window.webkitAudioContext = Tracked; }
	function unlock() {
		ctxs.forEach((c) => {
			if (c.state !== 'running') {
				c.resume();
				// a 1-sample silent buffer is the reliable iOS unlock
				try { const b = c.createBuffer(1, 1, 22050); const s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0); } catch (e) { /* ignore */ }
			}
		});
		if (ctxs.length && ctxs.every((c) => c.state === 'running')) {
			['touchend', 'pointerup', 'click', 'keydown'].forEach((e) => window.removeEventListener(e, unlock, true));
		}
	}
	['touchend', 'pointerup', 'click', 'keydown'].forEach((e) => window.addEventListener(e, unlock, true));
	document.addEventListener('visibilitychange', () => { if (!document.hidden) { ctxs.forEach((c) => c.resume && c.resume()); } });
}());
// Safe-area insets (notch / home indicator) in CSS px, read by the game via JavaScriptBridge.
window.turncoatSafeArea = function () {
	const s = getComputedStyle(document.getElementById('safe-probe'));
	return JSON.stringify({ top: parseFloat(s.paddingTop) || 0, bottom: parseFloat(s.paddingBottom) || 0, left: parseFloat(s.paddingLeft) || 0, right: parseFloat(s.paddingRight) || 0, h: window.innerHeight, w: window.innerWidth });
};
// Stop iOS rubber-banding / double-tap zoom / long-press menus.
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => e.preventDefault());

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":55395716,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
